name: StepStone private weekly archive
on:
  schedule:
    - cron: '0 5 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe: no DB; pilot: limited DB test; full: weekly acquisition'
        type: choice
        options: [probe, pilot, checkpoint_test, repair_small, repair_firefox, repair_resume, repair_resume_firefox, repair_endurance, repair_pagination_firefox, survey, pagination_pilot, transport_probe, transport_http1, alert_test, full]
        default: probe
permissions:
  contents: read
  issues: write
concurrency:
  group: stepstone-private-weekly
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONPATH: src
      PYTHONUNBUFFERED: '1'
      STEPSTONE_DATABASE_URL: ${{ secrets.STEPSTONE_DATABASE_URL }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cloud/stepstone/requirements.txt
      - run: pip install -r cloud/stepstone/requirements.txt
      - name: Install browser for bounded timeout recovery
        run: python -m playwright install --with-deps chromium firefox
      - name: Check contracts
        run: python -m unittest discover -s cloud/stepstone -p 'test_*.py'
      - name: Acquire portal jobs into private database only
        run: |
          if [ "${{ inputs.mode }}" = "alert_test" ]; then
            python cloud/stepstone/alert.py --test
          elif [ "${{ inputs.mode }}" = "probe" ]; then
            python cloud/stepstone/runtime.py --network-probe
          elif [ "${{ inputs.mode }}" = "pilot" ]; then
            python cloud/stepstone/runtime.py --limit-searches 1 --max-details 3
          elif [ "${{ inputs.mode }}" = "checkpoint_test" ]; then
            python cloud/stepstone/checkpoint_probe.py
          elif [ "${{ inputs.mode }}" = "repair_small" ]; then
            python cloud/stepstone/runtime.py --repair-small
          elif [ "${{ inputs.mode }}" = "repair_firefox" ]; then
            sleep 60
            python cloud/stepstone/runtime.py --repair-small --browser-engine firefox
          elif [ "${{ inputs.mode }}" = "repair_resume" ]; then
            python cloud/stepstone/runtime.py --repair-small --resume-only --max-details 5
          elif [ "${{ inputs.mode }}" = "repair_resume_firefox" ]; then
            sleep 60
            python cloud/stepstone/runtime.py --repair-small --resume-only --max-details 5 --browser-engine firefox
          elif [ "${{ inputs.mode }}" = "repair_endurance" ]; then
            python cloud/stepstone/runtime.py --repair-small --sample-pages 5 --sample-per-search 3 --browser-engine firefox
          elif [ "${{ inputs.mode }}" = "repair_pagination_firefox" ]; then
            python cloud/stepstone/runtime.py --pagination-pilot --browser-engine firefox
          elif [ "${{ inputs.mode }}" = "survey" ]; then
            python cloud/stepstone/runtime.py --sample-per-search 2
          elif [ "${{ inputs.mode }}" = "pagination_pilot" ]; then
            python cloud/stepstone/runtime.py --pagination-pilot
          elif [ "${{ inputs.mode }}" = "transport_probe" ]; then
            python cloud/stepstone/transport_probe.py
          elif [ "${{ inputs.mode }}" = "transport_http1" ]; then
            python cloud/stepstone/transport_probe.py --http1
          else
            python cloud/stepstone/runtime.py
          fi
      - name: Alert if workflow failed
        if: failure() && inputs.mode != 'probe'
        run: python cloud/stepstone/alert.py
